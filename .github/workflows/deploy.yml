name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/matbakh
            git fetch origin main
            git reset --hard origin/main
            docker build -t matbakh-app ./matbakh
            docker rm -f matbakh-app 2>/dev/null || true
            docker run -d --name matbakh-app --restart unless-stopped --env-file /var/www/matbakh/.env -p 3000:3000 matbakh-app
